<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>

<body class="bg-light">

<div class="container">

<h2 class="text-center mt-5">Admin Login</h2>

<form method="POST">

<input class="form-control mt-3" name="username" placeholder="Username">

<input class="form-control mt-3" name="password" type="password" placeholder="Password">

<button class="btn btn-primary mt-3">Login</button>

</form>

</div>

</body>
</html>
